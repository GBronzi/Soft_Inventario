name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Las ventas de Tiendanube ya aplicadas se filtran por numero de orden individual antes de mostrarse como pendientes.
            - Una venta antigua devuelta por Tiendanube por updated_at ya no se mezcla con una venta nueva si ya estaba registrada.
            - Se reconocen tambien referencias antiguas combinadas, por ejemplo Tiendanube #180, #160, para evitar duplicados.

            ## Control operativo
            - Al aplicar ventas de Tiendanube, cada orden se registra por separado con su referencia propia.
            - Si una venta vieja no existia localmente, se registra con la fecha real del pedido Tiendanube, no con la fecha de sincronizacion.
            - Se mantiene la proteccion para no descontar stock dos veces por la misma orden.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - No corrige automaticamente movimientos historicos ya grabados con fecha incorrecta; evita que el problema se repita en nuevas sincronizaciones.
            - Si una venta vieja ya quedo registrada mal en la base del cliente, debe corregirse con un ajuste puntual de base.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
