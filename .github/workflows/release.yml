name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Reportes de ventas
            - Nueva ventana con importes y unidades por dia, mes y año.
            - Comparacion con el mismo mes del año anterior y ranking de productos vendidos.
            - Desglose por Programa/Tiendanube y por Yves d'Orgeval, Arabes / demas marcas y Decant.

            ## Respaldo de gastos
            - Los gastos nuevos se guardan en SQLite y se incluyen en los siguientes respaldos .db.
            - Los gastos anteriores se importan una sola vez desde el almacenamiento local al abrir Gastos o crear un respaldo.

            ## Importante
            - Los respaldos .db de versiones anteriores no contenian gastos. Se recomienda exportar Gastos a CSV antes de instalar esta version.
            - Esta actualizacion no elimina ni reinicia la base local ni modifica la sincronizacion con Tiendanube.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
