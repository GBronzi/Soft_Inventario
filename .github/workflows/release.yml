name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Los cambios hechos desde el programa hacia Tiendanube se suben automaticamente y no requieren aprobacion manual.
            - Se preserva la imagen remota de Tiendanube al editar productos desde el programa.
            - El puente local de imagen se mantiene con la URL que devuelve Tiendanube luego de sincronizar.

            ## Apariencia
            - Nueva opcion Apariencia y resolucion en Configuracion.
            - Permite elegir Pantalla chica, Estandar o Pantalla grande.
            - Ajusta texto, botones, separaciones y area util segun la pantalla del cliente.

            ## Importante
            - Tiendanube al programa sigue mostrando cambios para revisar y aplicar seleccionados.
            - Programa a Tiendanube sigue subiendo cambios automaticamente.
            - Antes de instalar se crea un respaldo automatico de la base de datos local.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
