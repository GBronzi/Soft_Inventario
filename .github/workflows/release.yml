name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Interfaz visual
            - Se aplica el estilo Liquid Glass en botones, tarjetas, campos, tablas, barra lateral y paneles principales.
            - Se mejora la legibilidad en tema claro, gris y oscuro para evitar textos blancos sobre fondos claros.
            - Se ajusta el login, el boton de mostrar contraseña y el boton Ingresar.
            - Acciones rapidas ya no muestra Venta rapida local.

            ## Respaldo y configuracion
            - La tarjeta Backup local ahora muestra mejor el estado del respaldo y la restauracion.
            - Se agregan mas perfiles de resolucion para pantallas de clientes con menor altura o menor definicion.

            ## Ventas y horarios
            - Se corrige la visualizacion de hora en movimientos, Kardex, Ventas del dia y Registro de ventas.
            - Ventas del dia ahora suma ventas confirmadas de Tiendanube y salidas manuales registradas como venta.
            - El Registro de ventas filtra movimientos reales de venta para evitar contar ajustes negativos como ventas.

            ## Sincronizacion Tiendanube
            - Las ventas de Tiendanube se tratan como venta aplicable solo cuando el pago figura confirmado como paid.
            - Las ordenes pendientes, autorizadas, abandonadas, anuladas o reembolsadas no descuentan stock local.
            - Si Tiendanube baja stock por una orden no pagada, el programa deja aviso en el registro de sincronizacion y espera confirmacion de pago.
            - Los cambios entrantes quedan en cola local para que un aviso nuevo no reemplace uno anterior pendiente.
            - Si hay varios avisos del mismo producto o variante, el programa obliga a resolver primero los mas antiguos.

            ## Proteccion de stock
            - Evita descontar productos en el programa cuando el cliente deja, rechaza o no concreta una compra en Tiendanube.
            - Las diferencias que no coinciden exactamente con ventas pagadas quedan como revision de stock, no como venta confirmada.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Se mantiene el flujo de revision antes de aplicar cambios desde Tiendanube.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
