name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - La revision de cambios ahora permite resolver cada fila de forma individual.
            - Se agrega la opcion Programa para enviar a Tiendanube el valor local correcto en cambios de datos, stock o precio.
            - Se agrega la opcion Descartar para quitar avisos pendientes que no se quieran aplicar, sin tocar el stock local ni Tiendanube.
            - Se reducen avisos innecesarios de categoria cuando Tiendanube y el programa tienen nombres equivalentes aunque los IDs internos difieran.

            ## Control operativo
            - El boton Usar valores del programa ya no queda limitado solo a datos generales.
            - Los cambios resueltos se retiran de la lista sin borrar el resto de revisiones pendientes.
            - Se conserva el flujo de revision antes de tomar cambios desde Tiendanube.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Usar Programa actualiza Tiendanube con el valor local seleccionado.
            - Descartar solo limpia el aviso pendiente; no modifica productos ni movimientos.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
