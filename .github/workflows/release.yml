name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Se reorganiza la ventana Sincronizacion para reducir el scroll horizontal.
            - La tarjeta Sincronizacion y Direcciones separadas quedan en la primera fila.
            - El Panel de sincronizacion queda en una segunda fila independiente y mas amplia.

            ## Control operativo
            - Los botones por fila ahora usan nombres mas claros: Programa y Tienda nube.
            - Programa toma el cambio desde Tiendanube y lo guarda localmente.
            - Tienda nube envia el valor correcto del programa hacia Tiendanube.
            - La tarjeta Direcciones separadas incluye una leyenda para explicar Programa, Tienda nube y Descartar.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - No cambia la logica de stock ni ventas; es un ajuste visual y de claridad operativa.
            - Descartar sigue limpiando el aviso pendiente sin modificar productos ni movimientos.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
