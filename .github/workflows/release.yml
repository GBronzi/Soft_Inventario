name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Variantes y catalogo
            - Eliminar una variante con historial la retira del catalogo sin borrar sus ventas ni movimientos.
            - Las variantes vinculadas a Tiendanube conservan su identificador para que la sincronizacion no las importe otra vez como nuevas.
            - Las variantes retiradas dejan de aparecer en busquedas, escaner, ventas, movimientos y alertas de stock locales.
            - Se conserva el acceso a la ficha historica mediante su enlace directo, con una indicacion clara de que fue retirada.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Las variantes marcadas como DISCONTINUADO antes de esta version deben eliminarse otra vez para retirarlas del catalogo.
            - Retirar una variante vinculada del catalogo local no la elimina de Tiendanube.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
