name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Correccion de fechas Tiendanube
            - El historial operativo, ventas del dia, registro mensual, anulaciones y resumen mensual ahora reconocen correctamente fechas Tiendanube con zona horaria tipo +0000.
            - Las ventas #181/#182 y casos similares quedan ubicados por su fecha local real y ya no se ocultan por el filtro de fecha.
            - El ajuste previo antes de una venta pagada de Tiendanube toma la fecha de la venta asociada para no aparecer separado en el dia de aplicacion.

            ## Sincronizacion
            - Los botones de resolucion ahora muestran textos mas claros: Enviar a programa y Enviar a Tiendanube.
            - La columna Resolver fue ampliada para evitar textos pisados en el panel de sincronizacion.

            ## Variantes de producto
            - La ficha del producto incorpora accion para eliminar variantes.
            - Si la variante tiene historial, se marca como DISCONTINUADO para conservar ventas y kardex.
            - Se alinearon titulos y columnas de la tabla Variantes del producto.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Las ventas de Tiendanube que ya existian pero no se veian por formato de fecha pasan a aparecer con los filtros corregidos.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
