name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Operacion de caja
            - Se corrige el error al confirmar Nueva venta: cannot start a transaction within a transaction.
            - La venta multiple ya no abre una transaccion manual incompatible con el pool SQLite de Tauri.
            - Se mantiene el registro de venta, detalle, Kardex, descuento de stock y envio posterior de stock a Tiendanube.

            ## Importante
            - Esta actualizacion apunta al problema reportado en caja/nueva venta.
            - No cambia la regla de sincronizacion: Programa a Tiendanube sube stock automaticamente; Tiendanube al programa sigue esperando revision del operador.
            - Antes de instalar se crea un respaldo automatico de la base de datos local.          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
