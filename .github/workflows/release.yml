name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Se agrega el cambio Imagen en la ventana Sincronizacion para completar productos locales sin imagen usando la URL principal de Tiendanube.
            - Al aplicar Imagen, solo se actualiza la URL local de imagen; no se modifica stock, precio ni datos generales.
            - Se mantiene la revision seleccionable para que el cliente decida que imagenes completar.

            ## Importante
            - Stock, precio, ventas Tiendanube y productos nuevos mantienen el flujo de revision existente.
            - Antes de instalar se crea un respaldo automatico de la base de datos local.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
