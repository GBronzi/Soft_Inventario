name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Se ajusta la tabla del Panel de sincronizacion para evitar que el tipo de cambio invada la columna Producto / Variante.
            - La columna Tipo ahora tiene mas ancho y mantiene etiquetas como Venta Tiendanube en una sola linea.
            - Se mantiene la distribucion de tarjetas de Sincronizacion y Direcciones separadas en la primera fila.

            ## Control operativo
            - Los botones Programa, Tienda nube y Descartar quedan mas compactos dentro de cada fila.
            - Se mejora la lectura de filas largas sin cambiar la logica de sincronizacion.
            - Programa sigue tomando el cambio desde Tiendanube y Tienda nube sigue enviando el valor local.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - No cambia la logica de stock ni ventas; es un ajuste visual de tabla.
            - Descartar sigue limpiando el aviso pendiente sin modificar productos ni movimientos.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
