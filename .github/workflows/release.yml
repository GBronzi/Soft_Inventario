name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Sincronizacion Tiendanube
            - Se corrige la revision de Datos para no mostrar diferencias antiguas o locales como cambios entrantes de Tiendanube.
            - Al enviar datos locales a Tiendanube, el programa verifica con una lectura posterior que Tiendanube confirme nombre, descripcion, marca, SEO, visibilidad y categoria.
            - Si Tiendanube responde OK pero no aplica algun dato, ahora se muestra el campo no confirmado en el registro de operaciones.
            - La accion de datos locales no toca stock ni precio de variantes.

            ## Detalle de producto
            - La descripcion comercial respeta parrafos, saltos de linea, listas y formato basico importado desde Tiendanube.

            ## Importante
            - Stock, precio, ventas Tiendanube y productos nuevos mantienen el flujo de revision existente.
            - Antes de instalar se crea un respaldo automatico de la base de datos local.          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
