name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Catalogo
            - Nueva vista Retirados para localizar las variantes ocultas del catalogo.
            - La restauracion individual conserva stock, historial e identificador de Tiendanube; no sincroniza stock durante la accion.
            - Se muestran los identificadores local y de Tiendanube para distinguir variantes similares antes de restaurarlas.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Las variantes retiradas permanecen en la base hasta que se restaure cada una expresamente.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
