name: Publicar actualización

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventario App ${{ github.ref_name }}"
          releaseBody: |
            ## Registro de ventas
            - Se agrega una ventana de Registro de ventas desde Vista general para revisar ventas del programa y bajas detectadas desde Tiendanube por mes.
            - La tabla muestra origen, fecha, producto, variante, cantidad, total y permite guardar comentarios por registro.
            - El selector mensual permite filtrar el historial sin modificar inventario ni sincronizacion.

            ## Exportacion Excel
            - Se corrige el boton Excel para guardar el archivo con el dialogo nativo de Windows.
            - El archivo se genera en formato CSV compatible con Excel, incluyendo totales del mes y comentarios.

            ## Sincronizacion y stock
            - Las ventas detectadas desde Tiendanube quedan registradas como salidas de venta para mejorar la trazabilidad mensual.
            - Se mantiene separado el flujo Tiendanube al programa y programa a Tiendanube para no aplicar cambios sin revision cuando corresponda.

            ## Importante
            - Esta actualizacion no elimina ni reinicia la base local del cliente.
            - Antes de instalar se recomienda conservar un respaldo reciente de la base de datos local.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
