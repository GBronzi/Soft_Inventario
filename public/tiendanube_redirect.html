<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiendanube redirect</title>
  <script>
    // Tiendanube solo envía 'code' (y opcionalmente 'state') al redirect_uri.
    // El user_id se obtiene luego al intercambiar el code por el access token.
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');

    if (code) {
      // Redirige a la app Tauri mediante el esquema personalizado
      const redirect = `soft-inventario://auth?code=${encodeURIComponent(code)}${state ? `&state=${encodeURIComponent(state)}` : ''}`;
      window.location.replace(redirect);
    } else {
      // Si falta el code, muestra un mensaje de ayuda
      document.body.innerHTML = '<p>Parámetros de autorización faltantes.</p>';
    }
  </script>
</head>
<body>
  <p>Redirigiendo…</p>
</body>
</html>
