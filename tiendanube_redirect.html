<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiendanube → Soft Inventario</title>
  <style>
    body {font-family: system-ui, sans-serif; text-align:center; padding:2rem;}
    .msg {margin-top:2rem; color:#555;}
  </style>
</head>
<body>
  <h1>Redirigiendo…</h1>
  <p class="msg">Cargando autorización, por favor espere.</p>
  <script>
    const p = new URLSearchParams(window.location.search);
    const code = p.get('code');
    const userId = p.get('user_id');
    if (code && userId) {
      const deep = `soft-inventario://auth?code=${encodeURIComponent(code)}&user_id=${encodeURIComponent(userId)}`;
      window.location.href = deep;
    } else {
      document.querySelector('.msg').textContent = 'Faltan parámetros de autorización. Intente nuevamente.';
    }
  </script>
</body>
</html>
