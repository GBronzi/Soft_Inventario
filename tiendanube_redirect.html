<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiendanube redirect</title>
</head>
<body>
  <p>Redirigiendo…</p>
  <script>
    // Extrae los parámetros que Tiendanube envía (code, user_id, state)
    // Se manejan tanto query string como fragmento (hash) porque Tiendanube a veces devuelve los datos en el hash.
    const url = new URL(window.location.href);
    const searchParams = new URLSearchParams(url.search);
    // Si el hash contiene parámetros, los añadimos a searchParams para simplificar la obtención.
    if (url.hash) {
      const hashParams = new URLSearchParams(url.hash.substring(1)); // quita '#'
      hashParams.forEach((value, key) => {
        if (!searchParams.has(key)) searchParams.append(key, value);
      });
    }
    // Tiendanube solo envía 'code' (y opcionalmente 'state') al redirect_uri.
    // El user_id se obtiene luego al intercambiar el code por el access token.
    const code = searchParams.get('code');
    const userId = searchParams.get('user_id');
    const state = searchParams.get('state');
    console.log('Redirect page extracted params:', { code, userId, state });
    if (code) {
      // Redirige a la app Tauri mediante el esquema personalizado.
      // Se reenvía user_id solo si estuviera presente (forward-compat).
      const redirect = `soft-inventario://auth?code=${encodeURIComponent(code)}${userId ? `&user_id=${encodeURIComponent(userId)}` : ''}${state ? `&state=${encodeURIComponent(state)}` : ''}`;
      console.log('Redirecting to Tauri with:', redirect);
      // Navegar al esquema que abre la aplicación Tauri
      window.location.replace(redirect);
      // Intentar cerrar la ventana del navegador después de un breve retraso
      setTimeout(() => {
        window.close();
      }, 500);
    } else {
      document.body.innerHTML = '<p>Parámetros de autorización faltantes.</p>';
    }
  </script>
</body>
</html>
